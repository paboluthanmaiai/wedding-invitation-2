<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8EE" />
      <stop offset="50%" stop-color="#F7EADB" />
      <stop offset="100%" stop-color="#EEDAC4" />
    </linearGradient>
    <linearGradient id="silkSari" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#991B33" />
      <stop offset="50%" stop-color="#800020" />
      <stop offset="100%" stop-color="#580414" />
    </linearGradient>
    <linearGradient id="goldZari" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE89C" />
      <stop offset="35%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#F5DF88" />
      <stop offset="100%" stop-color="#9E781E" />
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#FFF0D0" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FFF0D0" stop-opacity="0" />
    </radialGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="750" fill="url(#bgGlow)" rx="16" />
  <circle cx="300" cy="320" r="240" fill="url(#halo)" />

  <!-- Traditional Temple Arch Backdrop -->
  <path d="M 120 750 L 120 340 C 120 220 200 140 300 140 C 400 140 480 220 480 340 L 480 750" fill="none" stroke="#D4AF37" stroke-width="2.5" stroke-dasharray="6,4" opacity="0.6" />
  <path d="M 140 750 L 140 350 C 140 240 210 165 300 165 C 390 165 460 240 460 350 L 460 750" fill="none" stroke="#800020" stroke-width="1.5" opacity="0.3" />

  <!-- Corner Ornamental Accents -->
  <g stroke="#C5A059" stroke-width="1.5" fill="none" opacity="0.7">
    <path d="M 40 40 L 90 40 M 40 40 L 40 90 M 40 40 Q 65 65 90 90" />
    <circle cx="65" cy="65" r="4" fill="#800020" stroke="none" />
    <path d="M 560 40 L 510 40 M 560 40 L 560 90 M 560 40 Q 535 65 510 90" />
    <circle cx="535" cy="65" r="4" fill="#800020" stroke="none" />
  </g>

  <!-- Bride Illustration -->
  <!-- Shoulders & Kanjeevaram Sari Pallu -->
  <path d="M 140 750 C 150 630 190 540 240 500 C 270 480 330 480 360 500 C 410 540 450 630 460 750 Z" fill="url(#silkSari)" />
  
  <!-- Intricate Gold Zari Border on Pallu -->
  <path d="M 170 750 C 200 640 270 540 340 520 L 370 550 C 300 580 230 670 200 750 Z" fill="url(#goldZari)" opacity="0.9" />
  <path d="M 230 505 Q 300 550 370 510" stroke="url(#goldZari)" stroke-width="8" fill="none" />
  
  <!-- Sari Brocade Motifs (Mayura / Floral) -->
  <g fill="#D4AF37" opacity="0.75">
    <circle cx="230" cy="650" r="6" />
    <circle cx="270" cy="690" r="6" />
    <circle cx="340" cy="670" r="7" />
    <circle cx="390" cy="710" r="6" />
    <circle cx="310" cy="620" r="5" />
    <path d="M 230 642 Q 230 658 238 650 Q 222 650 230 642 Z" />
    <path d="M 340 662 Q 340 678 348 670 Q 332 670 340 662 Z" />
  </g>

  <!-- Layered Gold Necklaces (Kasulaperu, Choker & Haram) -->
  <path d="M 265 480 Q 300 515 335 480" stroke="url(#goldZari)" stroke-width="7" fill="none" />
  <path d="M 252 505 Q 300 550 348 505" stroke="url(#goldZari)" stroke-width="9" fill="none" stroke-dasharray="10,3" />
  <path d="M 238 535 Q 300 610 362 535" stroke="url(#goldZari)" stroke-width="6" fill="none" />
  <!-- Ruby/Emerald Pendant -->
  <polygon points="300,560 312,580 300,600 288,580" fill="#800020" stroke="url(#goldZari)" stroke-width="2" />
  <circle cx="300" cy="580" r="4" fill="#2E7D32" />

  <!-- Neck & Graceful Jawline -->
  <path d="M 270 410 L 270 490 Q 300 500 330 490 L 330 410 Z" fill="#E8B896" />
  <path d="M 270 440 Q 300 460 330 440" stroke="#C99370" stroke-width="1.5" fill="none" opacity="0.6" />

  <!-- Face Profile/Silhouette -->
  <ellipse cx="300" cy="355" rx="65" ry="85" fill="#EFC3A4" />

  <!-- Jasmine Flower Poola Jada (Hair Flowers) -->
  <g fill="#FFFDF8" stroke="#D4AF37" stroke-width="0.8">
    <ellipse cx="230" cy="300" rx="14" ry="10" />
    <ellipse cx="236" cy="325" rx="15" ry="11" />
    <ellipse cx="245" cy="355" rx="16" ry="12" />
    <ellipse cx="258" cy="385" rx="17" ry="13" />
    <ellipse cx="225" cy="275" rx="13" ry="9" />
    <!-- Golden beads in jasmine -->
    <circle cx="230" cy="300" r="3" fill="#D4AF37" />
    <circle cx="236" cy="325" r="3" fill="#D4AF37" />
    <circle cx="245" cy="355" r="3" fill="#D4AF37" />
    <circle cx="258" cy="385" r="3" fill="#D4AF37" />
  </g>

  <!-- Traditional Hair Bun / Kondai -->
  <path d="M 235 340 C 210 320 215 250 270 230 C 330 210 380 240 375 320 C 365 300 350 260 300 260 C 255 260 240 300 235 340 Z" fill="#24140D" />
  <!-- Hair parting line & front soft waves -->
  <path d="M 255 310 C 275 285 300 280 345 310 C 335 330 320 340 300 340 C 280 340 265 330 255 310 Z" fill="#2E1C14" />

  <!-- Maang Tikka (Nethi Chutti) -->
  <line x1="300" y1="260" x2="300" y2="305" stroke="url(#goldZari)" stroke-width="3" />
  <circle cx="300" cy="312" r="8" fill="url(#goldZari)" />
  <circle cx="300" cy="312" r="4" fill="#800020" />
  <circle cx="300" cy="325" r="3" fill="#D4AF37" />

  <!-- Eyebrows, Eyes, Smiling Lips -->
  <path d="M 275 338 Q 288 333 295 338" stroke="#3D2115" stroke-width="2.5" fill="none" stroke-linecap="round" />
  <path d="M 305 338 Q 312 333 325 338" stroke="#3D2115" stroke-width="2.5" fill="none" stroke-linecap="round" />
  <!-- Graceful Kohl-lined Eyes -->
  <path d="M 276 348 Q 287 341 296 349 Q 287 353 276 348 Z" fill="#20110B" />
  <path d="M 304 349 Q 313 341 324 348 Q 313 353 304 349 Z" fill="#20110B" />
  <!-- Auspicious Vermilion Bindi (Bottu) -->
  <circle cx="300" cy="334" r="3.5" fill="#800020" />

  <!-- Nose Ring (Mukkupudaka) -->
  <circle cx="308" cy="365" r="2" fill="url(#goldZari)" />
  <!-- Cheeks Blush & Lips -->
  <ellipse cx="278" cy="368" rx="8" ry="5" fill="#E89B9B" opacity="0.4" />
  <ellipse cx="322" cy="368" rx="8" ry="5" fill="#E89B9B" opacity="0.4" />
  <path d="M 292 385 Q 300 392 308 385 Q 300 382 292 385 Z" fill="#A83248" />

  <!-- Traditional Gold Jhumkas (Earrings) -->
  <g fill="url(#goldZari)" stroke="#800020" stroke-width="0.5">
    <circle cx="248" cy="370" r="5" />
    <path d="M 241 378 Q 248 375 255 378 L 253 388 Q 248 392 243 388 Z" />
    <circle cx="248" cy="393" r="2" fill="#D4AF37" />

    <circle cx="352" cy="370" r="5" />
    <path d="M 345 378 Q 352 375 359 378 L 357 388 Q 352 392 347 388 Z" />
    <circle cx="352" cy="393" r="2" fill="#D4AF37" />
  </g>

  <!-- Marigold and Rose Garland (Varmala) Drape -->
  <g stroke="#C5A059" stroke-width="0.5">
    <!-- Left garland segment -->
    <circle cx="210" cy="540" r="14" fill="#FF8C00" />
    <circle cx="195" cy="565" r="15" fill="#FFB703" />
    <circle cx="185" cy="595" r="16" fill="#D90429" />
    <circle cx="178" cy="630" r="17" fill="#FF8C00" />
    <circle cx="172" cy="670" r="18" fill="#FFB703" />
    <circle cx="170" cy="710" r="18" fill="#D90429" />
    <!-- Right garland segment -->
    <circle cx="390" cy="540" r="14" fill="#FF8C00" />
    <circle cx="405" cy="565" r="15" fill="#FFB703" />
    <circle cx="415" cy="595" r="16" fill="#D90429" />
    <circle cx="422" cy="630" r="17" fill="#FF8C00" />
    <circle cx="428" cy="670" r="18" fill="#FFB703" />
    <circle cx="430" cy="710" r="18" fill="#D90429" />
  </g>

  <!-- Outer Double Border -->
  <rect x="16" y="16" width="568" height="718" rx="10" fill="none" stroke="#D4AF37" stroke-width="2" />
  <rect x="24" y="24" width="552" height="702" rx="6" fill="none" stroke="#800020" stroke-width="1" stroke-dasharray="8,4" />
</svg>
