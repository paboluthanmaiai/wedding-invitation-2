<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGlowGroom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBF3" />
      <stop offset="50%" stop-color="#F8ECE0" />
      <stop offset="100%" stop-color="#EEDAC4" />
    </linearGradient>
    <linearGradient id="silkKurta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9" />
      <stop offset="50%" stop-color="#F6EEDB" />
      <stop offset="100%" stop-color="#E9DCBF" />
    </linearGradient>
    <linearGradient id="zariBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE89C" />
      <stop offset="35%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#F5DF88" />
      <stop offset="100%" stop-color="#9E781E" />
    </linearGradient>
    <linearGradient id="maroonStole" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#800020" />
      <stop offset="100%" stop-color="#550015" />
    </linearGradient>
    <radialGradient id="haloGroom" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#FFF0D0" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FFF0D0" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="750" fill="url(#bgGlowGroom)" rx="16" />
  <circle cx="300" cy="320" r="240" fill="url(#haloGroom)" />

  <!-- Traditional Temple Pillars & Arch Backdrop -->
  <path d="M 120 750 L 120 340 C 120 220 200 140 300 140 C 400 140 480 220 480 340 L 480 750" fill="none" stroke="#D4AF37" stroke-width="2.5" stroke-dasharray="6,4" opacity="0.6" />
  <path d="M 140 750 L 140 350 C 140 240 210 165 300 165 C 390 165 460 240 460 350 L 460 750" fill="none" stroke="#800020" stroke-width="1.5" opacity="0.3" />

  <!-- Corner Ornamental Accents -->
  <g stroke="#C5A059" stroke-width="1.5" fill="none" opacity="0.7">
    <path d="M 40 40 L 90 40 M 40 40 L 40 90 M 40 40 Q 65 65 90 90" />
    <circle cx="65" cy="65" r="4" fill="#800020" stroke="none" />
    <path d="M 560 40 L 510 40 M 560 40 L 560 90 M 560 40 Q 535 65 510 90" />
    <circle cx="535" cy="65" r="4" fill="#800020" stroke="none" />
  </g>

  <!-- Groom Kurta & Shoulders -->
  <path d="M 140 750 C 150 610 190 520 240 490 C 270 475 330 475 360 490 C 410 520 450 610 460 750 Z" fill="url(#silkKurta)" />
  
  <!-- Kurta Traditional Mandarin Collar -->
  <path d="M 268 470 Q 300 485 332 470 L 332 495 Q 300 505 268 495 Z" fill="#E8DEC5" stroke="url(#zariBorder)" stroke-width="2" />
  <line x1="300" y1="500" x2="300" y2="660" stroke="url(#zariBorder)" stroke-width="3" />
  <!-- Kurta Gold Buttons -->
  <circle cx="300" cy="525" r="4" fill="#800020" stroke="url(#zariBorder)" stroke-width="1" />
  <circle cx="300" cy="565" r="4" fill="#800020" stroke="url(#zariBorder)" stroke-width="1" />
  <circle cx="300" cy="605" r="4" fill="#800020" stroke="url(#zariBorder)" stroke-width="1" />
  <circle cx="300" cy="645" r="4" fill="#800020" stroke="url(#zariBorder)" stroke-width="1" />

  <!-- Traditional Silk Kanduva / Angavastram with Grand Zari Border -->
  <path d="M 220 495 Q 240 600 220 750 L 165 750 Q 185 600 170 515 Z" fill="url(#maroonStole)" />
  <path d="M 220 495 Q 240 600 220 750" stroke="url(#zariBorder)" stroke-width="8" fill="none" />
  <path d="M 165 750 Q 185 600 170 515" stroke="url(#zariBorder)" stroke-width="4" fill="none" />
  <!-- Right Angavastram drape -->
  <path d="M 380 495 Q 360 610 390 750 L 440 750 Q 420 590 430 515 Z" fill="url(#maroonStole)" opacity="0.9" />
  <path d="M 380 495 Q 360 610 390 750" stroke="url(#zariBorder)" stroke-width="8" fill="none" />

  <!-- Neck -->
  <path d="M 268 405 L 268 480 Q 300 495 332 480 L 332 405 Z" fill="#E8B896" />

  <!-- Face -->
  <ellipse cx="300" cy="350" rx="64" ry="80" fill="#EFC3A4" />

  <!-- Hair Style (Sharp, Traditional Groom Look) -->
  <path d="M 235 340 C 230 280 250 240 300 235 C 350 240 370 280 365 340 C 355 315 345 275 300 275 C 255 275 245 315 235 340 Z" fill="#20110B" />
  <path d="M 238 310 C 255 270 310 270 360 300 C 350 290 330 270 300 270 C 265 270 245 295 238 310 Z" fill="#2C1A12" />

  <!-- Ears & Gold Studs (Kadiyalu) -->
  <ellipse cx="236" cy="355" rx="8" ry="16" fill="#E8B896" />
  <circle cx="236" cy="362" r="3" fill="url(#zariBorder)" />
  <ellipse cx="364" cy="355" rx="8" ry="16" fill="#E8B896" />
  <circle cx="364" cy="362" r="3" fill="url(#zariBorder)" />

  <!-- Sandalwood Paste & Kumkum Tilak (Auspicious Telugu Namam / Bottu) -->
  <rect x="298" y="305" width="4" height="24" fill="#C5A059" rx="2" />
  <circle cx="300" cy="328" r="3" fill="#800020" />

  <!-- Eyebrows, Groom Eyes -->
  <path d="M 268 335 Q 282 328 293 334" stroke="#2B160C" stroke-width="3" fill="none" stroke-linecap="round" />
  <path d="M 307 334 Q 318 328 332 335" stroke="#2B160C" stroke-width="3" fill="none" stroke-linecap="round" />
  <!-- Clear, Confident Eyes -->
  <ellipse cx="280" cy="346" rx="9" ry="5.5" fill="#23130C" />
  <ellipse cx="320" cy="346" rx="9" ry="5.5" fill="#23130C" />
  <circle cx="282" cy="344" r="2" fill="#FFFFFF" />
  <circle cx="322" cy="344" r="2" fill="#FFFFFF" />

  <!-- Nose & Clean Stubble / Smile -->
  <path d="M 300 340 L 297 364 Q 300 369 306 366" stroke="#C99370" stroke-width="2" fill="none" stroke-linecap="round" />
  <path d="M 288 385 Q 300 395 312 385" stroke="#800020" stroke-width="2.5" fill="none" stroke-linecap="round" />

  <!-- Pearl and Gold Wedding Mala (Groom Necklace) -->
  <path d="M 260 490 Q 300 540 340 490" stroke="#FFFDF5" stroke-width="6" fill="none" stroke-dasharray="7,3" />
  <path d="M 250 515 Q 300 580 350 515" stroke="url(#zariBorder)" stroke-width="4" fill="none" />

  <!-- Marigold and Jasmine Varmala Drape -->
  <g stroke="#C5A059" stroke-width="0.5">
    <circle cx="215" cy="550" r="14" fill="#FF8C00" />
    <circle cx="205" cy="580" r="15" fill="#FFFDF5" />
    <circle cx="198" cy="615" r="16" fill="#FFB703" />
    <circle cx="192" cy="655" r="17" fill="#800020" />
    <circle cx="188" cy="695" r="18" fill="#FF8C00" />
    <circle cx="185" cy="735" r="18" fill="#FFFDF5" />

    <circle cx="385" cy="550" r="14" fill="#FF8C00" />
    <circle cx="395" cy="580" r="15" fill="#FFFDF5" />
    <circle cx="402" cy="615" r="16" fill="#FFB703" />
    <circle cx="408" cy="655" r="17" fill="#800020" />
    <circle cx="412" cy="695" r="18" fill="#FF8C00" />
    <circle cx="415" cy="735" r="18" fill="#FFFDF5" />
  </g>

  <!-- Outer Double Border -->
  <rect x="16" y="16" width="568" height="718" rx="10" fill="none" stroke="#D4AF37" stroke-width="2" />
  <rect x="24" y="24" width="552" height="702" rx="6" fill="none" stroke="#800020" stroke-width="1" stroke-dasharray="8,4" />
</svg>
